// IronFox overrides for Phoenix-specific preferences...

// Set our release channel
/// IRONFOX_CHANNEL is set by the build scripts
let ironfoxChannel = '{IRONFOX_CHANNEL}';

if (ironfoxChannel == 'nightly') {
    ironfoxNightly = true;
    ironfoxRelease = false;
} else {
    ironfoxRelease = true;
    ironfoxNightly = false;
};

// Set our version
/// IRONFOX_VERSION is set by the build scripts
/// (This is set here instead of at ironfox.cfg so that we only have to parse this file, instead of parsing both this file AND ironfox.cfg)
let ironfoxVersion = '{IRONFOX_VERSION}';

// Disable Phoenix's FPP granular override functionality
/// We import these via Remote Settings dumps instead
/// (which also means users can just directly modify `privacy.fingerprintingProtection.granularOverrides`)
defaultPref("browser.phoenix.fingerprintingProtection.granular.functionality.enabled", false);

// Re-enable the `EfficientCanvasRandomization` FPP target
/// Phoenix disables it due to upstream bugs that prevent randomization from applying properly,
/// but we fix those bugs with our `gecko-fix-canvas-randomization` patch
defaultPref("browser.phoenix.fingerprintingProtection.global.consumerOverrides", "+EfficientCanvasRandomization");

/// Migrate user-specified global FPP overrides from the old IronFox-specific preference
defaultPref("browser.ironfox.phoenixFPP.migration.completed", false);
if (getPref("browser.ironfox.phoenixFPP.migration.completed") == false) {
    defaultPref("browser.ironfox.fingerprintingProtection.userGlobalOverrides", "");
    if (getPref("browser.ironfox.fingerprintingProtection.userGlobalOverrides") != "") {
        ifLegacyFppOverrides = getPref("browser.ironfox.fingerprintingProtection.userGlobalOverrides");
        pref("browser.phoenix.fingerprintingProtection.global.userOverrides", `${ifLegacyFppOverrides}`);
        clearPref("browser.ironfox.fingerprintingProtection.userGlobalOverrides");
        lockPref("browser.ironfox.fingerprintingProtection.userGlobalOverrides", "");
    };
    pref("browser.ironfox.phoenixFPP.migration.completed", true);
};

// If we're not on Nightly, always reset the preference to enable Remote Debugging (`devtools.debugger.remote-enabled`) per-session
/// If we're on Nightly, the preference will still be reset by default, but users can prevent it from being reset with the
/// `browser.phoenix.reset.devtools.debugger.remote-enabled` preference
if (ironfoxNightly != true) {
    lockPref("browser.phoenix.reset.devtools.debugger.remote-enabled", true);
};

// These are no-ops for us due to our UI toggles
lockPref("browser.phoenix.reset.javascript.options.wasm", false);
lockPref("browser.phoenix.reset.network.http.referer.XOriginPolicy", false);
