.build_cache: &build_cache
  - key: cache-cargo-$CI_COMMIT_REF_SLUG
    policy: pull-push
    paths:
      # Cargo cache
      # See: https://doc.rust-lang.org/cargo/guide/cargo-home.html#caching-the-cargo-home-in-ci
      - $CI_PROJECT_DIR/build/.cargo/.crates.toml
      - $CI_PROJECT_DIR/build/.cargo/.crates2.json
      - $CI_PROJECT_DIR/build/.cargo/bin/
      - $CI_PROJECT_DIR/build/.cargo/registry/index/
      - $CI_PROJECT_DIR/build/.cargo/registry/cache/
      - $CI_PROJECT_DIR/build/.cargo/git/db/
  - key: cache-gradle-$CI_COMMIT_REF_SLUG
    policy: pull-push
    paths:
      - $CI_PROJECT_DIR/build/.gradle/caches
      - $CI_PROJECT_DIR/build/gradle/cache

.compressed_artifact_output: &compressed_artifact_output
  artifacts:
    untracked: false
    when: always
    access: all
    expire_in: "30 days"
    paths:
      # Jobs must specify the IRONFOX_JOB_ARTIFACT_NAME variable
      - $CI_PROJECT_DIR/artifacts/$IRONFOX_JOB_ARTIFACT_NAME.tar.xz

default:
  cache: []
  retry:
    max: 2
    when:
      - data_integrity_failure
      - job_execution_timeout
      - runner_configuration_error
      - runner_external_dependency_failure
      - runner_interrupted
      - runner_system_failure
      - scheduler_failure
      - stale_schedule
      - stuck_or_timeout_failure
      - unknown_failure

variables: &common_variables
  ARTIFACT_COMPRESSION_LEVEL: 'slowest'
  CACHE_COMPRESSION_LEVEL: 'slowest'
  FF_USE_FASTZIP: '1'
  IRONFOX_CI: 1
  IRONFOX_DEV_BRANCH: 'dev'
  IRONFOX_PROD_BRANCH: 'main'
  TRANSFER_METER_FREQUENCY: '2s'

stages:
  - lint
  - build_site
  - build_docker
  - build_ironfox
  - release
  - build_fdroid

# Fast, lightweight gate: shellcheck + shfmt over the shell scripts.
# Runs first so a lint failure stops the pipeline before the multi-hour builds.
# Uses a minimal image and is NOT namespace-gated, so it also runs for forks / contributor pipelines.
lint-scripts:
  image: fedora:43
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  variables:
    <<: *common_variables
  before_script:
    - set -euo pipefail
    - /bin/sudo /bin/dnf update -y --refresh
    - /bin/sudo /bin/dnf install -y bash curl shasum tar
    - /bin/bash scripts/get_sources.sh shellcheck
    - /bin/bash scripts/get_sources.sh shfmt
  script:
    - set -euo pipefail
    - /bin/bash scripts/lint.sh

update-fdroid-repo:
  image: fedora:43
  stage: build_fdroid
  rules:
    - if: $CI_PROJECT_NAMESPACE != "ironfox-oss"
      when: never
    - if: $CI_COMMIT_BRANCH == $IRONFOX_PROD_BRANCH
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    <<: *common_variables
  script:
    - set -euo pipefail
    - /bin/bash scripts/ci-update-fdroid-repo.sh

update-site-repo:
  image: fedora:43
  stage: build_site
  rules:
    - if: $CI_PROJECT_NAMESPACE != "ironfox-oss"
      when: never
    - changes:
      - scripts/a-s-patches.yaml
      - scripts/glean-patches.yaml
      - scripts/patches.yaml
      - scripts/ci-update-site.sh
      - .gitlab-ci.yml
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    <<: *common_variables
  script:
    - set -euo pipefail
    - /bin/bash scripts/ci-update-site-repo.sh

build-docker:
  image: docker:cli
  stage: build_docker
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    <<: *common_variables
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - set -euo pipefail
    - docker build --pull -t "${DOCKER_IMAGE_NAME}" .
    - docker push "${DOCKER_IMAGE_NAME}"
    - |
      if [[ "${CI_COMMIT_BRANCH}" == "${IRONFOX_DEV_BRANCH}" ]]; then
        docker tag "${DOCKER_IMAGE_NAME}" "${CI_REGISTRY_IMAGE}:latest"
        docker push "${CI_REGISTRY_IMAGE}:latest"
      fi
  rules:
    - if: $CI_PROJECT_NAMESPACE != "ironfox-oss"
      when: never
    - if: $CI_COMMIT_BRANCH
      exists:
        - Dockerfile
      changes:
        - Dockerfile
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $IRONFOX_PROD_BRANCH
  tags:
    - saas-linux-2xlarge-amd64

build-geckoview:
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  stage: build_ironfox
  timeout: 2h
  needs:
    - job: "build-docker"
      optional: true
  tags:
    - saas-linux-2xlarge-amd64
  parallel:
    matrix:
      - IRONFOX_CI_TARGET_ARCH: ['arm64', 'arm', 'x86_64']
  variables:
    RUNNER_SCRIPT_TIMEOUT: 1h 50m
    <<: *common_variables
  script:
    - set -euo pipefail
    - /bin/bash scripts/ci-build.sh "${IRONFOX_CI_TARGET_ARCH}" 'geckoview'
  artifacts:
    untracked: false
    when: always
    access: all
    expire_in: "30 days"
    paths:
      - $CI_PROJECT_DIR/artifacts/logs/**/*
  rules:
    - if: $CI_PROJECT_NAMESPACE != "ironfox-oss"
      when: never
    - changes:
        - patches/**/*
        - scripts/**/*
        - Dockerfile
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG
      when: never

build-fenix:
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  stage: build_ironfox
  timeout: 3h
  needs:
    - job: "build-docker"
      optional: true
    - job: "build-geckoview"
      artifacts: false
      optional: false
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    IRONFOX_CI_TARGET_ARCH: 'bundle'
    RUNNER_SCRIPT_TIMEOUT: 2h 50m
    <<: *common_variables
  script:
    - set -euo pipefail
    - /bin/bash scripts/ci-build.sh "${IRONFOX_CI_TARGET_ARCH}" 'fenix'
  artifacts:
    untracked: false
    when: always
    access: all
    expire_in: "30 days"
    paths:
      - $CI_PROJECT_DIR/artifacts/logs/**/*
  rules:
    - if: $CI_PROJECT_NAMESPACE != "ironfox-oss"
      when: never
    - changes:
        - patches/**/*
        - scripts/**/*
        - Dockerfile
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG
      when: never

prepare-release:
  image: fedora:43
  stage: release
  interruptible: true
  needs:
    - job: "build-docker"
      optional: true
    - job: "build-geckoview"
      artifacts: false
      optional: true
    - job: "build-fenix"
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $IRONFOX_PROD_BRANCH && $CI_COMMIT_MESSAGE =~ /\[skip-release\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $IRONFOX_PROD_BRANCH
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    <<: *common_variables
  script:
    - set -euo pipefail
    - /bin/bash scripts/ci-prepare-release.sh
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: "30 days"
    paths:
      - build/release.yml

publish-release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  interruptible: true
  needs:
    - job: "prepare-release"
      artifacts: true
      optional: false
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $IRONFOX_PROD_BRANCH && $CI_COMMIT_MESSAGE =~ /\[skip-release\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $IRONFOX_PROD_BRANCH
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    <<: *common_variables
  script:
    - set -euo pipefail
    - set +x
    - |
      release-cli \
        --server-url "${CI_SERVER_URL}" \
        --project-id "${CI_PROJECT_ID}" \
        --private-token "${IRONFOX_GITLAB_CI_API_TOKEN}" \
        create-from-file \
        --file build/release.yml
