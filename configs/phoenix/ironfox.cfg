
//
// Melding the Phoenix into a fox, with a strong coat of Iron…

// This is home to IronFox-specific preferences and configurations. Using AutoConfig instead of the standard pref files is preferable here,
// as it supports more advanced capabilities - ex. we can set user preferences, reset preferences, unlock preferences,
// set preferences if certain ones are/aren't set, etc.
// We can also set values depending on environment variables, and thanks to our patch, we can use this to configure environment variables directly as well.

/*** Environment ***/

// Disable GFX crash telemetry
/// https://searchfox.org/firefox-main/rev/0989a082/gfx/thebes/gfxEnv.h#100
/// https://searchfox.org/firefox-main/rev/0989a082/gfx/thebes/gfxPlatform.cpp#373
setEnv("MOZ_GFX_CRASH_MOZ_CRASH", 1);
setEnv("MOZ_GFX_CRASH_TELEMETRY", '');

// Disable Mozilla's ASan Crash Reporter
/// https://searchfox.org/firefox-main/rev/131497bb/toolkit/xre/nsEmbedFunctions.cpp#260
/// https://firefox-source-docs.mozilla.org/tools/sanitizer/asan_nightly.html
/// https://github.com/choller/firefox-asan-reporter
setEnv("MOZ_DISABLE_ASAN_REPORTER", 1);

// Disable Mozilla's Crash Reporter
/// https://firefox-source-docs.mozilla.org/toolkit/crashreporter/crashreporter/index.html#user-specified-environment-variables
setEnv("MOZ_ANDROID_CRASH_HANDLER", ''); // https://searchfox.org/firefox-main/rev/131497bb/mobile/android/geckoview/src/main/java/org/mozilla/gecko/mozglue/GeckoLoader.java#170
setEnv("MOZ_CRASHREPORTER", '');
setEnv("MOZ_CRASHREPORTER_DISABLE", 1);
setEnv("MOZ_CRASHREPORTER_NO_REPORT", 1);
setEnv("MOZ_CRASHREPORTER_URL", 'data;');

// Disable SSLKEYLOGGING
/// https://bugzilla.mozilla.org/show_bug.cgi?id=1183318
/// https://bugzilla.mozilla.org/show_bug.cgi?id=1915224
setEnv("SSLKEYLOGFILE", '');

/*** Preferences ***/

// Branding
lockPref("app.releaseNotesURL",         IRONFOX_RELEASES_URL);
lockPref("app.releaseNotesURL.prompt",  IRONFOX_RELEASES_URL);
lockPref("app.update.url.details",      IRONFOX_RELEASES_URL);
lockPref("app.update.url.manual",       IRONFOX_RELEASES_URL);
lockPref("app.vendorURL",               IRONFOX_URL);

/// Get Phoenix version
const PHOENIX_VERSION = getPref("browser.phoenix.version");

/// Set branding at `about:support`
lockPref("app.support.vendor", `${IRONFOX_APP_NAME_PRETTY}: ${IRONFOX_VERSION} | Phoenix - Extended: ${PHOENIX_VERSION}`);

// Onboarding
/// Once the onboarding is completed, this pref is set to true
/// On IronFox's onboarding, we want to allow the installation of uBlock Origin (if certain strict criteria is met - 
/// see gecko-ironfox-settings-support-xpinstall.patch) without needing to also enable the installation of add-ons
/// After onboarding though, we don't want this to be the case - so we use this pref to only allow the
/// installation during the onboarding
defaultPref("browser.ironfox.onboardingCompleted", false);

// Disable add-on installation by default
defaultPref("xpinstall.enabled", false);

/// Configure default list of sites allowed to install add-ons
// Firefox on Android is unable to prompt users for permission when websites attempt to install add-ons - which is why this is necessary
// This functionality typically isn't supported at all on Android, but our patch to allow installing add-ons without mozAddonManager implements it
// This list should be kept to a minimum; users should really stick to AMO if possible for installing extensions
// But I think it's reasonable to allow users to install certain trustworthy add-ons directly from the developer if preferred - it might even be the only way for users to install add-ons in some cases (ex. censorship: https://discourse.mozilla.org/t/the-censorship-circumvention-extension-has-disappeared-from-the-russian-version-of-mozilla-addons/130914, https://www.theregister.com/2024/06/14/mozilla_firefox_russia/)
// These are set as separate preferences to make it easier for users to customize the list of allowed sources - ex. maybe I want to only allow installing add-ons from AMO (`addons.mozilla.org`), I could just clear the values of the prefs EXCEPT for `xpinstall.whitelist.add.AMO`
// Users can add their own sites here by creating their own preferences with a similar format and values like below, and can of course always just download and install the `.xpi` file directly anyways
defaultPref("xpinstall.whitelist.add.AdGuard", "https://agrd.io,https://static.adguard.com,https://static.adtidy.org"); // AdGuard
defaultPref("xpinstall.whitelist.add.AdGuard.PBM", "https://agrd.io^privateBrowsingId=1,https://static.adguard.com^privateBrowsingId=1,https://static.adtidy.org^privateBrowsingId=1"); // AdGuard (Private Browsing)
defaultPref("xpinstall.whitelist.add.AMO", "https://addons.mozilla.org"); // AMO
defaultPref("xpinstall.whitelist.add.AMO.PBM", "https://addons.mozilla.org^privateBrowsingId=1"); // AMO (Private Browsing)
defaultPref("xpinstall.whitelist.add.EFF", "https://eff.org,https://privacybadger.org"); // Privacy Badger
defaultPref("xpinstall.whitelist.add.EFF.PBM", "https://eff.org^privateBrowsingId=1,https://privacybadger.org^privateBrowsingId=1"); // Privacy Badger (Private Browsing)
defaultPref("xpinstall.whitelist.add.Mullvad", "https://mullvad.net"); // Mullvad
defaultPref("xpinstall.whitelist.add.Mullvad.PBM", "https://mullvad.net^privateBrowsingId=1"); // Mullvad (Private Browsing)
defaultPref("xpinstall.whitelist.add.NoScript", "https://noscript.net,https://secure.informaction.com"); // NoScript
defaultPref("xpinstall.whitelist.add.NoScript.PBM", "https://noscript.net^privateBrowsingId=1,https://secure.informaction.com^privateBrowsingId=1"); // NoScript (Private Browsing)

/// Ensure the install permissions (imported from the`xpinstall.whitelist.add` prefs) are reset per-session
defaultPref("browser.ironfox.xpinstall.permsImported", false);
clearPref("browser.ironfox.xpinstall.permsImported");

// Disable WebGL by default
/// This controls whether our custom FPP target is active, which can be controlled on a per-site basis
/// webgl.disabled can be used to disable WebGL globally instead if preferred
defaultPref("browser.ironfox.webgl.disabled", true);
defaultPref("webgl.disabled", false); // [DEFAULT] Ensure WebGL isn't disabled globally (in favor of our FPP target) - overrides Phoenix

/// Disable timezone spoofing by default
defaultPref("browser.ironfox.fingerprintingProtection.timezoneSpoofing.enabled", false);

/// Enable FIDO
// Phoenix disables FIDO for Android, due to GeckoView usually using/relying on the proprietary Google Play FIDO library
// (and Google Play Services)
// We replace the Google Play FIDO library with the FOSS microG FIDO library though, so this doesn't really apply to us
defaultPref("security.webauth.webauthn_enable_softtoken", false);

/// Enable our granular FPP overrides by default
defaultPref("browser.ironfox.fingerprintingProtection.hardenOverrides.enabled", true); // Overrides from us that *harden* protections for certain sites
defaultPref("browser.ironfox.fingerprintingProtection.unbreakOverrides.enabled", true); // Overrides from us that *relax* protections for certain sites to reduce breakage
defaultPref("browser.ironfox.fingerprintingProtection.unbreakTimezoneOverrides.enabled", true); // Overrides from us that disable timezone spoofing for certain sites to reduce breakage
defaultPref("browser.ironfox.fingerprintingProtection.unbreakWebGLOverrides.enabled", true); // Overrides from us that re-enable WebGL for certain sites to reduce breakage

/// Enable Mozilla's granular FPP overrides by default
defaultPref("browser.ironfox.fingerprintingProtection.mozillaOverrides.enabled", true);

// Disable mozAddonManager
/// mozAddonManager prevents extensions from working on `addons.mozilla.org`, and this API also exposes a list of the user's installed add-ons to `addons.mozilla.org`
/// Setting the following preferences usually breaks installation of extensions from `addons.mozilla.org` on Android, but we fix this with our `gecko-support-addon-installation-without-mozaddonmanager` patch
/// https://bugzilla.mozilla.org/show_bug.cgi?id=1952390#c4
/// https://bugzilla.mozilla.org/show_bug.cgi?id=1384330
defaultPref("extensions.webapi.enabled", false);
defaultPref("privacy.resistFingerprinting.block_mozAddonManager", true);

// Do not forcibly detach the console debugger by default
defaultPref("browser.ironfox.devtools.debugger.force_detach", false);

// Enable our Beacon API (navigator.sendBeacon) stub
/// Unlike standard Firefox, this doesn't actually enable the Beacon API; this just enables our stub - see the `stub-beacon` patch for more details
defaultPref("beacon.enabled", true); // [DEFAULT]

// Enable console logging by default
defaultPref("browser.ironfox.devtools.console.logging_disabled", false);

// Enable the Phoenix add-on blocklist by default
/// https://codeberg.org/celenity/Phoenix/src/branch/pages/build/policies/blocklist.json
defaultPref("browser.ironfox.extensions.blocklist.enabled", true);

// Ensure that certain site permissions are always/only controlled by their respective UI/permission prompts
lockPref("geo.prompt.testing", false); // [DEFAULT] Geolocation
lockPref("media.eme.require-app-approval", true); // [DEFAULT] EME
lockPref("media.eme.require-app-approval.prompt.testing", false); // [DEFAULT] EME
lockPref("media.geckoview.autoplay.request", true); // [DEFAULT] Media autoplay
lockPref("media.geckoview.autoplay.request.testing", 0); // [DEFAULT] Media autoplay
lockPref("network.loopback-network.prompt.testing", false); // [DEFAULT] LNA - loopback-network (localhost)
lockPref("network.localnetwork.prompt.testing", false); // [DEFAULT] LNA - local network
lockPref("notification.prompt.testing", false); // [DEFAULT] Notifications

