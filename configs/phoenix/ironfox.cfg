const PHOENIX_VERSION = getPref("browser.phoenix.version");
lockPref("app.support.vendor", `${IRONFOX_APP_NAME_PRETTY}: ${IRONFOX_VERSION} | Phoenix - Extended: ${PHOENIX_VERSION}`);

defaultPref("browser.ironfox.status", "002");

/*** 003 OVERRIDES ***/

// Overrides for standard Gecko preferences

// Configure default list of sites allowed to install add-ons (if add-on installation is enabled)
/// Firefox on Android is unable to prompt users for permission when websites attempt to install add-ons - which is why this is necessary
/// This functionality typically isn't supported at all on Android, but our patch to allow installing add-ons without mozAddonManager implements it
/// This list should be kept to a minimum; users should really stick to AMO if possible for installing extensions
/// But I think it's reasonable to allow users to install certain trustworthy add-ons directly from the developer if preferred - it might even be the only way for users to install add-ons in some cases (ex. censorship: https://discourse.mozilla.org/t/the-censorship-circumvention-extension-has-disappeared-from-the-russian-version-of-mozilla-addons/130914, https://www.theregister.com/2024/06/14/mozilla_firefox_russia/)
/// These are set as separate preferences to make it easier for users to customize the list of allowed sources - ex. maybe I want to only allow installing add-ons from AMO (`addons.mozilla.org`), I could just clear the values of the prefs EXCEPT for `xpinstall.whitelist.add.AMO`
/// Users can add their own sites here by creating their own preferences with a similar format and values like below, and can of course always just download and install the `.xpi` file directly anyways
defaultPref("xpinstall.whitelist.add.AdGuard", "https://agrd.io,https://static.adguard.com,https://static.adtidy.org"); // AdGuard
defaultPref("xpinstall.whitelist.add.AdGuard.PBM", "https://agrd.io^privateBrowsingId=1,https://static.adguard.com^privateBrowsingId=1,https://static.adtidy.org^privateBrowsingId=1"); // AdGuard (Private Browsing)
defaultPref("xpinstall.whitelist.add.AMO", "https://addons.mozilla.org"); // AMO
defaultPref("xpinstall.whitelist.add.AMO.PBM", "https://addons.mozilla.org^privateBrowsingId=1"); // AMO (Private Browsing)
defaultPref("xpinstall.whitelist.add.EFF", "https://eff.org,https://privacybadger.org"); // Privacy Badger
defaultPref("xpinstall.whitelist.add.EFF.PBM", "https://eff.org^privateBrowsingId=1,https://privacybadger.org^privateBrowsingId=1"); // Privacy Badger (Private Browsing)
defaultPref("xpinstall.whitelist.add.Mullvad", "https://mullvad.net"); // Mullvad
defaultPref("xpinstall.whitelist.add.Mullvad.PBM", "https://mullvad.net^privateBrowsingId=1"); // Mullvad (Private Browsing)
defaultPref("xpinstall.whitelist.add.NoScript", "https://noscript.net,https://secure.informaction.com"); // NoScript
defaultPref("xpinstall.whitelist.add.NoScript.PBM", "https://noscript.net^privateBrowsingId=1,https://secure.informaction.com^privateBrowsingId=1"); // NoScript (Private Browsing)

// Disable add-on installation by default
defaultPref("xpinstall.enabled", false);

// Disable mozAddonManager
/// mozAddonManager prevents extensions from working on `addons.mozilla.org`, and this API also exposes a list of the user's installed add-ons to `addons.mozilla.org`
/// Setting the following preferences usually breaks installation of extensions from `addons.mozilla.org` on Android, but we fix this with our `gecko-support-addon-installation-without-mozaddonmanager` patch
/// https://bugzilla.mozilla.org/show_bug.cgi?id=1952390#c4
/// https://bugzilla.mozilla.org/show_bug.cgi?id=1384330
defaultPref("extensions.webapi.enabled", false);
defaultPref("privacy.resistFingerprinting.block_mozAddonManager", true);

// Enable Beacon API (navigator.sendBeacon) stub
/// This doesn't actually enable the Beacon API like it does on standard Firefox, it enables our stub instead
defaultPref("beacon.enabled", true);

// Enable FIDO
/// Phoenix disables FIDO for Android, due to GeckoView usually using/relying on
/// the proprietary Google Play FIDO library (and Google Play Services)
/// We replace the Google Play FIDO library with the FOSS microG FIDO library though, so
/// this doesn't really apply to us
defaultPref("security.webauth.webauthn_enable_softtoken", false);

// Enable WebGL globally
/// Phoenix disables WebGL globally, but we use our own custom FPP target instead
/// to control WebGL on a per-site basis
defaultPref("webgl.disabled", false);

// Ensure that certain site permissions are always/only controlled by their respective UI/permission prompts
lockPref("geo.prompt.testing", false); //  Geolocation
lockPref("media.eme.require-app-approval", true); // EME
lockPref("media.eme.require-app-approval.prompt.testing", false); // EME
lockPref("media.geckoview.autoplay.request", true); // Media autoplay
lockPref("media.geckoview.autoplay.request.testing", 0); // Media autoplay
lockPref("network.loopback-network.prompt.testing", false); // LNA - loopback-network (localhost)
lockPref("network.localnetwork.prompt.testing", false); // LNA - local network
lockPref("notification.prompt.testing", false); // Notifications

// Set default DoH provider
lockPref("network.trr.default_provider_uri", IRONFOX_DEFAULT_DOH_URL);

defaultPref("browser.ironfox.status", "003");

